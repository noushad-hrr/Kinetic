name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - dev_new
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kinetic-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kinetic-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production

      # Force project pages base path for GitHub Pages (repo URL includes /Kinetic/)
      - name: Set base href for GitHub Pages
        run: sed -i 's|<base href="/">|<base href="/Kinetic/">|g' dist/kinetic-app/browser/index.html

      # SPA fallback for direct-route refreshes on GitHub Pages
      - name: SPA fallback for GitHub Pages
        run: cp dist/kinetic-app/browser/index.html dist/kinetic-app/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kinetic-app/dist/kinetic-app/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
